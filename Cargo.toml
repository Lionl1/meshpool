[package]
name = "meshpool"
version = "0.1.0"
edition = "2024"
description = "Pool the compute of untrusted devices: WASM tasks, replicas and quorum"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
wasmtime = "50"
wat = "1"
